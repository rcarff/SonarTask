server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/sonar.crt;
    ssl_certificate_key /etc/nginx/certs/sonar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Allows a 64 MiB experiment ZIP plus multipart overhead.
    client_max_body_size 70m;
    error_page 413 = /__sonar_413.json;

    location = /__sonar_413.json {
        internal;
        default_type application/json;
        return 413 '{"ok":false,"message":"Experiment ZIP exceeds the 64 MiB upload limit."}';
    }

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Unity Web builds may emit pre-compressed .br/.gz data. If you enable
    # Decompression Fallback in Unity, these special blocks are optional.
    location ~ \.wasm\.br$ { default_type application/wasm; add_header Content-Encoding br; }
    location ~ \.js\.br$   { default_type application/javascript; add_header Content-Encoding br; }
    location ~ \.data\.br$ { default_type application/octet-stream; add_header Content-Encoding br; }
    location ~ \.wasm\.gz$ { default_type application/wasm; add_header Content-Encoding gzip; }
    location ~ \.js\.gz$   { default_type application/javascript; add_header Content-Encoding gzip; }
    location ~ \.data\.gz$ { default_type application/octet-stream; add_header Content-Encoding gzip; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
