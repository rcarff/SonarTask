services:
  api:
    build:
      context: ./Sonar.Server
    restart: unless-stopped
    environment:
      SONAR_DATA_ROOT: /data
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./Deploy/Experiments:/data/experiments
      - ./Deploy/Results:/data/results
      - ./Deploy/Config:/data/config
    networks: [sonar]

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Deploy/WebBuild:/usr/share/nginx/html:ro
      - ./Deploy/Certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [sonar]

networks:
  sonar:
    driver: bridge
