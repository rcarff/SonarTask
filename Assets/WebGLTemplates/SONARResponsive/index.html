<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SONAR Simulator Task</title>
  <link rel="icon" type="image/png" href="SonarIcon.png">
  <link rel="apple-touch-icon" href="SonarIcon.png">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #071018 url('SonarSplash.png') center center / cover no-repeat;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #071018 url('SonarSplash.png') center center / cover no-repeat;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: transparent;
    }

    #unity-loading {
      position: absolute;
      left: 50%;
      top: 88%;
      width: min(520px, 72vw);
      transform: translate(-50%, -50%);
      padding: 12px 18px;
      border-radius: 6px;
      background: rgba(3, 12, 20, 0.72);
      color: #e8eef4;
      font: 16px/1.4 Arial, Helvetica, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    #unity-progress-track {
      height: 8px;
      margin-top: 14px;
      border: 1px solid #64717c;
      background: #111c24;
    }

    #unity-progress-bar {
      width: 0%;
      height: 100%;
      background: #d9e2e8;
    }

    #unity-warning {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 20;
      font: 14px/1.4 Arial, Helvetica, sans-serif;
      pointer-events: none;
    }

    #unity-warning > div {
      margin-bottom: 6px;
      padding: 8px 10px;
      background: rgba(20, 26, 32, 0.94);
      color: white;
      border: 1px solid #87939d;
    }

    #unity-fullscreen-button {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 30;
      min-width: 104px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid #84919b;
      border-radius: 4px;
      background: rgba(25, 34, 42, 0.92);
      color: #eef4f7;
      font: 14px Arial, Helvetica, sans-serif;
      cursor: pointer;
      display: none;
    }

    #unity-fullscreen-button:hover { background: rgba(48, 62, 73, 0.96); }
    #unity-fullscreen-button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div>Loading SONAR Simulator Task...</div>
      <div id="unity-progress-track"><div id="unity-progress-bar"></div></div>
    </div>
    <div id="unity-warning"></div>
    <button id="unity-fullscreen-button" type="button" title="Enter fullscreen">Fullscreen</button>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#unity-loading");
    const progressBar = document.querySelector("#unity-progress-bar");
    const warningBanner = document.querySelector("#unity-warning");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.textContent = message;
      if (type === "error") div.style.borderColor = "#d75b5b";
      else if (type === "warning") div.style.borderColor = "#d8b04c";
      warningBanner.appendChild(div);
      if (type !== "error") setTimeout(() => div.remove(), 5000);
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,

      // Keep the CSS canvas and Unity render target automatically synchronized.
      // Force 1x browser pixels to avoid excessive GPU load on high-DPI displays.
      devicePixelRatio: 1
    };

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBar.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        window.sonarUnityInstance = unityInstance;
        loading.style.display = "none";
        document.body.style.background = "#071018";
        document.querySelector("#unity-container").style.background = "#071018";
        canvas.style.background = "#071018";
        fullscreenButton.style.display = "block";
        fullscreenButton.addEventListener("click", () => unityInstance.SetFullscreen(1));
        canvas.focus();
      }).catch((message) => {
        loading.style.display = "none";
        unityShowBanner(String(message), "error");
      });
    };
    script.onerror = () => {
      loading.style.display = "none";
      unityShowBanner("Unable to load the Unity Web loader.", "error");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
